{% extends "base.html" %}
{% block title %}Create your account{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-panel">
    <span class="auth-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>
      </svg>
    </span>

    <h1>Create your account</h1>
    <p class="auth-sub">Your subjects and GWA stay private to your account.</p>

    <form method="post" class="auth-form">
      {% csrf_token %}
      {% include "registration/_auth_fields.html" %}
      <button type="submit" class="primary auth-submit">Sign up</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
