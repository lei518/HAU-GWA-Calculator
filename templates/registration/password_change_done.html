{% extends "base.html" %}
{% block nav_settings %}is-active{% endblock %}
{% block title %}Password changed{% endblock %}
{% block content %}
<div class="settings-page">
  <h1>Account</h1>

  <section class="card settings-card">
    <div class="settings-done">
      <span class="settings-done-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/></svg>
      </span>
      <div>
        <h2>Password updated</h2>
        <p class="muted small">Use your new password the next time you sign in.</p>
      </div>
    </div>
    <div class="settings-actions">
      <a class="primary button" href="{% url 'subjects:dashboard' %}">Back to Home</a>
      <a class="button" href="{% url 'password_change' %}">Change it again</a>
    </div>
  </section>
</div>
{% endblock %}
